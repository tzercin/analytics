<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Proposed personal visual-system palette</title>
  <desc id="desc">A dark plum background with violet and magenta ambient glows, neutral text colors, and a restrained example diagram.</desc>

  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12101C"/>
      <stop offset="1" stop-color="#0B0912"/>
    </linearGradient>
    <radialGradient id="violet-glow">
      <stop offset="0" stop-color="#8250DC" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#8250DC" stop-opacity="0"/>
      <stop offset="1" stop-color="#8250DC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="magenta-glow">
      <stop offset="0" stop-color="#D246A0" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#D246A0" stop-opacity="0"/>
      <stop offset="1" stop-color="#D246A0" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#050309" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1400" height="900" fill="url(#base)"/>
  <ellipse cx="308" cy="162" rx="840" ry="450" fill="url(#violet-glow)"/>
  <ellipse cx="1148" cy="792" rx="770" ry="450" fill="url(#magenta-glow)"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="80" y="82" fill="#A39AAF" font-size="15" font-weight="700" letter-spacing="3">PERSONAL VISUAL SYSTEM / PALETTE 01</text>
    <text x="80" y="145" fill="#F7F4FF" font-size="48" font-weight="720">Dark, technical, restrained.</text>
    <text x="80" y="184" fill="#C9C2D8" font-size="19">Proposed color direction · layout and typography are illustrative</text>

    <g transform="translate(80 240)">
      <rect width="760" height="500" rx="26" fill="#171321" fill-opacity="0.82" stroke="#3A334A" filter="url(#soft-shadow)"/>

      <text x="42" y="58" fill="#A39AAF" font-size="14" font-weight="700" letter-spacing="2.2">EXAMPLE DIAGRAM</text>
      <text x="42" y="108" fill="#F7F4FF" font-size="30" font-weight="700">One clear idea per frame</text>
      <text x="42" y="140" fill="#C9C2D8" font-size="17">Neutral structure, one primary path, one point of emphasis.</text>

      <line x1="104" y1="284" x2="636" y2="284" stroke="#3A334A" stroke-width="2"/>
      <line x1="104" y1="284" x2="370" y2="284" stroke="#9C72E8" stroke-width="6" stroke-linecap="round"/>
      <line x1="370" y1="284" x2="636" y2="284" stroke="#E36DB8" stroke-width="6" stroke-linecap="round"/>

      <g transform="translate(62 235)">
        <rect width="160" height="98" rx="18" fill="#211A30" stroke="#3A334A"/>
        <circle cx="34" cy="34" r="10" fill="#9C72E8"/>
        <text x="56" y="39" fill="#F7F4FF" font-size="17" font-weight="650">Context</text>
        <text x="26" y="70" fill="#A39AAF" font-size="14">Start with facts</text>
      </g>

      <g transform="translate(290 235)">
        <rect width="160" height="98" rx="18" fill="#2A2040" stroke="#8250DC" stroke-width="2"/>
        <circle cx="34" cy="34" r="10" fill="#9C72E8"/>
        <text x="56" y="39" fill="#F7F4FF" font-size="17" font-weight="650">Structure</text>
        <text x="26" y="70" fill="#C9C2D8" font-size="14">Primary concept</text>
      </g>

      <g transform="translate(518 235)">
        <rect width="160" height="98" rx="18" fill="#2B1929" stroke="#D246A0" stroke-width="2"/>
        <circle cx="34" cy="34" r="10" fill="#E36DB8"/>
        <text x="56" y="39" fill="#F7F4FF" font-size="17" font-weight="650">Emphasis</text>
        <text x="26" y="70" fill="#C9C2D8" font-size="14">Inspect this point</text>
      </g>

      <g transform="translate(42 402)">
        <text y="0" fill="#A39AAF" font-size="13" font-weight="700" letter-spacing="1.8">COLOR BALANCE</text>
        <rect y="25" width="330" height="14" rx="7" fill="#211A30"/>
        <rect y="25" width="62" height="14" rx="7" fill="#8250DC"/>
        <rect x="62" y="25" width="23" height="14" rx="7" fill="#D246A0"/>
        <text x="350" y="38" fill="#C9C2D8" font-size="13">80 neutral / 15 violet / 5 magenta</text>
      </g>
    </g>

    <g transform="translate(892 240)">
      <text y="18" fill="#A39AAF" font-size="14" font-weight="700" letter-spacing="2.2">CORE TOKENS</text>

      <g transform="translate(0 48)">
        <rect width="428" height="94" rx="18" fill="#171321" stroke="#3A334A"/>
        <circle cx="48" cy="47" r="24" fill="#0B0912" stroke="#3A334A"/>
        <text x="90" y="39" fill="#F7F4FF" font-size="17" font-weight="650">Canvas</text>
        <text x="90" y="65" fill="#A39AAF" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">#12101C → #0B0912</text>
      </g>

      <g transform="translate(0 158)">
        <rect width="428" height="94" rx="18" fill="#171321" stroke="#3A334A"/>
        <circle cx="48" cy="47" r="24" fill="#8250DC"/>
        <text x="90" y="39" fill="#F7F4FF" font-size="17" font-weight="650">Violet / primary structure</text>
        <text x="90" y="65" fill="#A39AAF" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">#8250DC · bright #9C72E8</text>
      </g>

      <g transform="translate(0 268)">
        <rect width="428" height="94" rx="18" fill="#171321" stroke="#3A334A"/>
        <circle cx="48" cy="47" r="24" fill="#D246A0"/>
        <text x="90" y="39" fill="#F7F4FF" font-size="17" font-weight="650">Magenta / emphasis</text>
        <text x="90" y="65" fill="#A39AAF" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">#D246A0 · bright #E36DB8</text>
      </g>

      <g transform="translate(0 378)">
        <rect width="428" height="122" rx="18" fill="#171321" stroke="#3A334A"/>
        <circle cx="48" cy="42" r="16" fill="#F7F4FF"/>
        <circle cx="48" cy="82" r="16" fill="#C9C2D8"/>
        <text x="90" y="37" fill="#F7F4FF" font-size="17" font-weight="650">Information stays neutral</text>
        <text x="90" y="64" fill="#A39AAF" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">#F7F4FF · #C9C2D8</text>
        <text x="90" y="92" fill="#C9C2D8" font-size="14">Accents guide attention, not body copy.</text>
      </g>
    </g>

    <line x1="80" y1="800" x2="1320" y2="800" stroke="#3A334A"/>
    <text x="80" y="842" fill="#A39AAF" font-size="15">Violet glow: upper-left · Magenta glow: lower-right · Use bright variants for small marks on dark backgrounds</text>
    <text x="1320" y="842" text-anchor="end" fill="#E36DB8" font-size="13" font-weight="700" letter-spacing="1.6">PROPOSED / NOT APPROVED</text>
  </g>
</svg>
