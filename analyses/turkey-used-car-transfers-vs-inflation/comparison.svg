<title id="title">Türkiye passenger-car transfers and headline CPI inflation, January 2010 to July 2026</title>
<desc id="desc">Two panels. The upper panel shows monthly notarized passenger-car transfer counts. The lower panel compares their year-over-year change with headline CPI annual inflation. Transfers are a second-hand market activity proxy, not sales or sales value.</desc>
